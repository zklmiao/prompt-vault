<!doctype html>
<!-- 球窗夹具:模拟 pv-plugin-token-monitor 球窗实例(预览/dev 专用,不参与构建)。
     以最小 pv 桥(内存 kv + 罐头响应)+ 真实 main.js 源码驱动球体与右键菜单,
     用于亮/暗令牌与不同壁纸下的人工走查;「菜单收起自检」以断言回归菜单项
     点击收起路径(1.1.2 修复回归);「告警自检」以断言回归球告警态派生链
     (UI 卡 J:超阈值脉冲/徽标/tooltip 行 + 阈值抬高与开关关两条解除路径);
     窗口尺寸/拖动等 Rust 行为一律 noop。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>球窗夹具 — 用量监控</title>
    <style>
      /* 与 src/App.css 同步的主题令牌(夹具离线,直接内联) */
      :root {
        --bg: #f5f6f8; --panel: #ffffff; --panel-hover: #f6f7f9;
        --border: #e3e5ea; --border-strong: #c9cdd6;
        --text: #1f2329; --muted: #8a9099;
        --accent: #4f6ef2; --accent-hover: #3f5ce0; --accent-soft: #eef1ff;
        --on-accent: #ffffff; --danger: #d4494f; --danger-soft: #fdf1f1;
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.18);
      }
      :root[data-theme="dark"] {
        --bg: #17181c; --panel: #1f2127; --panel-hover: #262932;
        --border: #2e3138; --border-strong: #3d414b;
        --text: #e8eaf0; --muted: #9aa0ab;
        --accent: #6b83f3; --accent-hover: #5871ea; --accent-soft: #262c47;
        --danger: #e06b70; --danger-soft: #3a2629;
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.55);
      }
      html, body { height: 100%; margin: 0; }
      body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .desktop { position: relative; height: 100vh; overflow: hidden;
        background: linear-gradient(135deg, #2b5876 0%, #4e4376 55%, #6b5b95 100%); }
      .desktop.light-wall { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
      .pv-window { position: absolute; left: 140px; top: 150px; width: 84px; height: 84px; }
      .controls { position: fixed; right: 12px; top: 12px; display: flex; gap: 8px; }
      .controls button { padding: 4px 10px; border: 1px solid rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.16); color: #fff; border-radius: 6px;
        cursor: pointer; font-size: 12px; }
      .controls button:hover { background: rgba(255, 255, 255, 0.3); }
      .hint { position: fixed; left: 12px; bottom: 12px; color: rgba(255, 255, 255, 0.85);
        font-size: 12px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4); }
      .selftest { position: fixed; left: 12px; bottom: 34px; color: #fff; font-size: 12px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4); }
      .selftest[data-fail="1"] { color: #ffd7d9; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="desktop light-wall" id="desktop">
      <div class="pv-window" id="ball-root"></div>
    </div>
    <div class="controls">
      <button id="btn-theme">暗色令牌</button>
      <button id="btn-wall">换壁纸</button>
      <button id="btn-menu">模拟右键</button>
      <button id="btn-selftest">菜单收起自检</button>
      <button id="btn-alerttest">告警自检</button>
    </div>
    <div class="selftest" id="selftest-result" data-fail=""></div>
    <div class="hint">球窗夹具:球体 + 右键菜单走查(窗口扩缩/拖动为 noop)</div>
    <script type="module">
      // ---- 最小 pv 桥:内存 kv + 罐头用量响应(与 preview/mock-core.ts 同形) ----
      var now = Date.now();
      var kv = new Map(Object.entries({
        "tm.accounts": [
          { provider: "glm", label: "default" },
          { provider: "glm", label: "备用" },
          { provider: "glm-intl", label: "intl" },
          { provider: "volcengine", label: "default" },
          { provider: "opencode", label: "zen" },
        ],
        "ball.provider": "glm:default",
        "ball.poll": { enabled: false, intervalSec: 300 },
        "cache:glm:default": {
          provider: "glm",
          fiveHour: { percent: 23.5, resetAt: new Date(now + 2 * 3600e3 + 13 * 60e3).toISOString() },
          weekly: { percent: 61.2, resetAt: new Date(now + 3 * 86400e3).toISOString() },
          tokens24h: 44320, mcpMonthly: { currentValue: 800, usage: 230, remaining: 570 },
          fetchedAt: now,
        },
        "cache:glm:备用": {
          provider: "glm",
          fiveHour: { percent: 88.4, resetAt: new Date(now + 40 * 60e3).toISOString() },
          weekly: { percent: 30.1, resetAt: new Date(now + 2 * 86400e3).toISOString() },
          tokens24h: 1520000, mcpMonthly: { currentValue: 1000, usage: 640, remaining: 360 },
          fetchedAt: now,
        },
        "cache:glm-intl:intl": {
          provider: "glm-intl",
          fiveHour: { percent: 52.0, resetAt: new Date(now + 3 * 3600e3).toISOString() },
          weekly: { percent: 12.4, resetAt: new Date(now + 4 * 86400e3).toISOString() },
          tokens24h: 99000000, mcpMonthly: null, fetchedAt: now,
        },
        "cache:volcengine:default": {
          provider: "volcengine",
          fiveHour: { percent: 25, resetAt: new Date(now + 90 * 60e3).toISOString() },
          weekly: { percent: 22.5, resetAt: new Date(now + 3 * 86400e3).toISOString() },
          fetchedAt: now,
        },
        "cache:opencode:zen": {
          provider: "opencode",
          fiveHour: { percent: 83.3, resetAt: new Date(now + 4 * 3600e3).toISOString() },
          weekly: { percent: 42.1, resetAt: new Date(now + 3 * 86400e3).toISOString() },
          fetchedAt: now,
        },
      }));

      function cannedNetBody(url) {
        if (url.includes("/api/monitor/usage/quota/limit")) {
          return JSON.stringify({
            data: {
              level: "pro",
              limits: [
                { type: "TOKENS_LIMIT", percentage: 23.5, nextResetTime: now + 2 * 3600e3 + 13 * 60e3 },
                { type: "TOKENS_LIMIT", percentage: 61.2, nextResetTime: now + 3 * 86400e3 },
                { type: "TIME_LIMIT", currentValue: 800, usage: 230, remaining: 570 },
              ],
            },
          });
        }
        if (url.includes("/api/monitor/usage/model-usage")) {
          var buckets = [];
          for (var i = 0; i < 8; i++) buckets.push({ input: 1200 + i * 100, output: 3400 + i * 150 });
          return JSON.stringify({ data: { tokensUsage: buckets } });
        }
        if (url.includes("Action=GetAFPUsage")) {
          return JSON.stringify({
            Result: {
              AFPFiveHour: { Quota: "50.0", Used: "12.5", ResetTime: Math.floor((now + 90 * 60e3) / 1000) },
              AFPWeekly: { Quota: "200.0", Used: "45.0", ResetTime: Math.floor((now + 3 * 86400e3) / 1000) },
            },
          });
        }
        if (url.includes("zen/go/v1/usage")) {
          return JSON.stringify({
            usage: {
              rolling: { status: "ok", percent: 83.3, resetsAt: new Date(now + 4 * 3600e3).toISOString() },
              weekly: { status: "ok", percent: 42.1, resetsAt: new Date(now + 3 * 86400e3).toISOString() },
            },
          });
        }
        return "{}";
      }

      var pvWindowSetup = null;
      var bridge = {
        pluginId: "token-monitor",
        storage: {
          get: function (key) {
            return Promise.resolve(kv.has(key) ? JSON.parse(JSON.stringify(kv.get(key))) : null);
          },
          set: function (key, value) {
            kv.set(key, value === null ? null : JSON.parse(JSON.stringify(value)));
            return Promise.resolve();
          },
        },
        credentials: {
          configured: function () { return Promise.resolve(true); },
          set: function () { return Promise.resolve(); },
          delete: function () { return Promise.resolve(); },
        },
        net: {
          fetch: function (url) {
            return Promise.resolve({ status: 200, body: cannedNetBody(url) });
          },
        },
        window: {
          setup: function (cfg) { pvWindowSetup = cfg; },
          resize: function () { return Promise.resolve(); },
          hide: function () { return Promise.resolve(); },
          openPanel: function () { return Promise.resolve(); },
        },
        panel: { register: function () {} },
        i18n: { register: function () {} },
        commands: { register: function () {} },
      };

      // 球窗实例判定:main.js 读 __TAURI_INTERNALS__.metadata.currentWindow.label
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "pv-plugin-token-monitor" } },
        invoke: function () { return Promise.resolve(); },
      };

      const src = await fetch("/plugins-src/token-monitor/main.js").then(function (r) { return r.text(); });
      (new Function("pv", '"use strict";\n' + src))(bridge);
      if (pvWindowSetup && typeof pvWindowSetup.onMount === "function") {
        pvWindowSetup.onMount(document.getElementById("ball-root"));
      }

      // 人工走查钩子:暴露内存 kv —— 控制台写 tm.alert.<scope>(如 {enabled:true,threshold:20})
      // 后点「模拟右键 → 立即刷新」,即可看到球体脉冲/徽标/tooltip 告警行
      window.__tmHarnessKv = kv;

      // ---- 夹具控制:主题 / 壁纸 / 右键菜单 ----
      document.getElementById("btn-theme").addEventListener("click", function (e) {
        const dark = document.documentElement.dataset.theme !== "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        e.target.textContent = dark ? "亮色令牌" : "暗色令牌";
      });
      document.getElementById("btn-wall").addEventListener("click", function () {
        document.getElementById("desktop").classList.toggle("light-wall");
      });
      document.getElementById("btn-menu").addEventListener("click", function () {
        const wrap = document.querySelector(".pv-tm-wrap");
        if (wrap) {
          wrap.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
        }
      });

      // ---- 回归自检:菜单项点击必须收起菜单并缩回 84×84 ----
      // 1.1.0/1.1.1 的 closeTmMenu() 裸调用缺 wrap 实参曾静默 early-return,
      // 菜单项点击收不起(仅 blur 可收);1.1.2 修复回归,backlog 有案。
      function waitFor(cond, timeoutMs) {
        return new Promise(function (resolve, reject) {
          const t0 = Date.now();
          (function poll() {
            let ok;
            try { ok = cond(); } catch (e) { reject(e); return; }
            if (ok) { resolve(); return; }
            if (Date.now() - t0 > timeoutMs) { reject(new Error("waitFor 超时")); return; }
            setTimeout(poll, 30);
          })();
        });
      }

      document.getElementById("btn-selftest").addEventListener("click", async function () {
        const banner = document.getElementById("selftest-result");
        const checks = [];
        const resizes = [];
        const prevResize = bridge.window.resize;
        // 记录 resize 调用:扩窗应 > 84,收起应回到 84×84
        bridge.window.resize = function (w, h) { resizes.push([w, h]); return Promise.resolve(); };
        const menuOf = () => document.querySelector(".pv-tm-menu");
        const openMenu = async () => {
          document.querySelector(".pv-tm-wrap")
            .dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
          // openTmMenu 同步置 hidden=false,条目经账号视图异步填充 —— 必须等条目出现
          await waitFor(
            () => menuOf() && !menuOf().hidden && menuOf().querySelectorAll(".pv-tm-menu-item").length > 0,
            2000,
          );
        };
        try {
          // ① 右键展开:菜单可见 + 扩窗
          await openMenu();
          checks.push(["右键展开", !menuOf().hidden]);
          checks.push(["扩窗 resize", resizes.some(([w, h]) => w > 84 && h > 84)]);
          // ② 点击账号行(首个 = 选中行):应收起 + 缩回 84×84(曾失守路径)
          resizes.length = 0;
          menuOf().querySelectorAll(".pv-tm-menu-item")[0].click();
          await waitFor(() => menuOf().hidden, 2000);
          checks.push(["账号行点击收起", menuOf().hidden]);
          checks.push(["缩回 84×84", resizes.some(([w, h]) => w === 84 && h === 84)]);
          // ③ 动作行(带图标行,首个 = 立即刷新):同路径
          await openMenu();
          resizes.length = 0;
          menuOf().querySelector(".pv-tm-menu-icon").closest(".pv-tm-menu-item").click();
          await waitFor(() => menuOf().hidden, 2000);
          checks.push(["动作行点击收起", menuOf().hidden]);
          checks.push(["缩回 84×84(动作行)", resizes.some(([w, h]) => w === 84 && h === 84)]);
          const failed = checks.filter(([, ok]) => !ok);
          banner.textContent = "自检 " + (failed.length === 0 ? "全部通过" : "失败") + " — " +
            checks.map(([name, ok]) => name + (ok ? " ✓" : " ✗")).join(" · ");
          banner.dataset.fail = failed.length > 0 ? "1" : "";
        } catch (e) {
          banner.textContent = "自检异常:" + ((e && e.message) || e);
          banner.dataset.fail = "1";
        } finally {
          bridge.window.resize = prevResize;
        }
      });

      // ---- 回归自检:球告警态派生链(UI 卡 J)----
      // 写 tm.alert.glm:default → 菜单「立即刷新」(取数完成即重读配置)→
      // 断言 .pv-tm-alerting / 常驻脉冲图层 / 徽标显隐 / tooltip 告警行;
      // 阈值抬高与开关关闭两条解除路径同样断言(纯 UI 派生,不发通知)。
      const ALERT_KEY = "tm.alert.glm:default"; // glm:default 5h = 23.5%(罐头数据)
      document.getElementById("btn-alerttest").addEventListener("click", async function () {
        const banner = document.getElementById("selftest-result");
        const checks = [];
        try {
          const ball = () => document.querySelector(".pv-tm-ball");
          const refreshViaMenu = async () => {
            document.querySelector(".pv-tm-wrap")
              .dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
            const menuOf = () => document.querySelector(".pv-tm-menu");
            await waitFor(() => menuOf() && !menuOf().hidden &&
              menuOf().querySelectorAll(".pv-tm-menu-item").length > 0, 2000);
            menuOf().querySelector(".pv-tm-menu-icon").closest(".pv-tm-menu-item").click();
            await waitFor(() => menuOf().hidden, 2000);
          };
          // ① 阈值 20(23.5 ≥ 20):告警态全链
          kv.set(ALERT_KEY, { enabled: true, threshold: 20 });
          await refreshViaMenu();
          await waitFor(() => ball().classList.contains("pv-tm-alerting"), 2000);
          checks.push(["超阈值告警态", ball().classList.contains("pv-tm-alerting")]);
          checks.push(["脉冲图层常驻", !!ball().querySelector(".pv-tm-pulse")]);
          checks.push(["徽标显现", getComputedStyle(ball().querySelector(".pv-tm-badge")).display === "block"]);
          checks.push(["tooltip 告警行", ball().title.indexOf("已超阈值 20%") >= 0]);
          // ② 阈值 100(23.5 < 100):解除
          kv.set(ALERT_KEY, { enabled: true, threshold: 100 });
          await refreshViaMenu();
          await waitFor(() => !ball().classList.contains("pv-tm-alerting"), 2000);
          checks.push(["阈值抬高解除", !ball().classList.contains("pv-tm-alerting")]);
          checks.push(["徽标隐藏", getComputedStyle(ball().querySelector(".pv-tm-badge")).display === "none"]);
          // ③ 开关关:解除(徽标隐藏、tooltip 无告警行)
          kv.set(ALERT_KEY, { enabled: false, threshold: 20 });
          await refreshViaMenu();
          await waitFor(() => !ball().classList.contains("pv-tm-alerting"), 2000);
          checks.push(["开关关解除", !ball().classList.contains("pv-tm-alerting")]);
          checks.push(["tooltip 无告警行", ball().title.indexOf("已超阈值") < 0]);
          kv.delete(ALERT_KEY);
          const failed = checks.filter(([, ok]) => !ok);
          banner.textContent = "告警自检 " + (failed.length === 0 ? "全部通过" : "失败") + " — " +
            checks.map(([name, ok]) => name + (ok ? " ✓" : " ✗")).join(" · ");
          banner.dataset.fail = failed.length > 0 ? "1" : "";
        } catch (e) {
          banner.textContent = "告警自检异常:" + ((e && e.message) || e);
          banner.dataset.fail = "1";
        }
      });
    </script>
  </body>
</html>
