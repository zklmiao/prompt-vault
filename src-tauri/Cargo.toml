[package]
name = "prompt-vault"
version = "0.2.0-alpha"
description = "本地 Prompt 收藏工具"
authors = ["zklmiao"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prompt_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 插件 JS 改经 plugin_read_entry 内联注入(pv-1),不再需要 protocol-asset feature
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
notify = "8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
# Windows 凭据管理器封装(插件系统凭据服务,keyring 3 无默认 feature,按平台显式开启)
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# 插件网络代理:轻量 HTTP 栈(rustls + 系统根证书,关闭 cookies/gzip 等非必需 feature)
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
# 火山方舟 V4 请求签名
hmac = "0.12"
url = "2"
# 插件包解压(default-features=false,仅 deflate;zip-slip 防护与软链检测在本仓库内实现)
zip = { version = "2.4", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
